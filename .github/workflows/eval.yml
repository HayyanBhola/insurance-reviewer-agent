# Runs on every push and pull request: unit tests + the free evaluation gate.
# No API keys are needed: everything here is rules-only and uses no AI calls.
name: tests-and-eval

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Evaluation gate (free, rules-only)
        env:
          LLM_CACHE: "0"
        run: python evaluate.py --ci
